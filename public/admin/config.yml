backend:
  name: github
  repo: sustrr/restaurace-web
  branch: main

media_folder: public/images/events
public_folder: /images/events

locale: cs

collections:
  - name: notices
    label: Provozní oznámení
    label_singular: Oznámení
    folder: src/content/notices
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title

    fields:
      - label: Název
        name: title
        widget: string

      - label: Důvod / doplňující informace
        name: reason
        widget: text
        required: false

      - label: Typ oznámení
        name: type
        widget: select
        options:
          - { label: Zavřeno, value: closed }
          - { label: Uzavřená společnost, value: private-event }

      - label: Celodenní uzavření
        name: allDay
        widget: boolean
        default: true

      - label: Datum začátku omezení
        name: startDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Datum konce omezení
        name: endDate
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Datum znovuotevření
        name: reopenDate
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Čas znovuotevření
        name: reopenTime
        widget: string
        required: false
        hint: "Například 11:00"
        pattern:
          - '^([01]\d|2[0-3]):[0-5]\d$'
          - "Zadejte čas ve formátu HH:MM"

      - label: Zobrazovat od
        name: visibleFrom
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Zobrazovat do
        name: visibleUntil
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Publikováno
        name: published
        widget: boolean
        default: false

  - name: events
    label: Akce a speciální nabídky
    label_singular: Akce
    folder: src/content/events
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"

    fields:
      - label: Název akce
        name: title
        widget: string

      - label: Krátký popis
        name: description
        widget: text

      - label: Fotografie
        name: image
        widget: image
        required: false

      - label: Začátek akce
        name: startDate
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Konec akce
        name: endDate
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Zobrazovat od
        name: visibleFrom
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Zobrazovat do
        name: visibleUntil
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Publikováno
        name: published
        widget: boolean
        default: true

  - name: weekly-menu
    label: Polední menu
    label_singular: Týdenní menu
    folder: src/content/weekly-menu
    create: true
    extension: json
    format: json
    slug: "{{fields.weekStart}}"
    identifier_field: title

    fields:
      - label: Název týdne
        name: title
        widget: string

      - label: Pondělí daného týdne
        name: weekStart
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD

      - label: Publikováno
        name: published
        widget: boolean
        default: false

      - label: Jednotlivé dny
        name: days
        widget: list
        summary: "{{fields.day}}"
        fields:
          - label: Den
            name: day
            widget: select
            options:
              - { label: Pondělí, value: monday }
              - { label: Úterý, value: tuesday }
              - { label: Středa, value: wednesday }
              - { label: Čtvrtek, value: thursday }
              - { label: Pátek, value: friday }

          - label: Zavřeno
            name: closed
            widget: boolean
            default: false

          - label: Polední menu se nepodává
            name: noLunchMenu
            widget: boolean
            default: false

          - label: Zpráva k polednímu menu
            name: message
            widget: string
            required: false

          - label: Polévka
            name: soups
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: Název polévky, name: name, widget: string }

          - label: Hlavní jídla
            name: meals
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: Název jídla, name: name, widget: string }
              - { label: Cena v Kč, name: price, widget: number, value_type: int, min: 0 }
              - { label: Alergeny, name: allergens, widget: string, required: false }

  - name: foodMenu
    label: "Jídelní lístek"
    files:
      - name: menu
        label: "Jídelní lístek"
        file: "src/content/foodMenu/menu.json"
        format: json
        fields:
          - label: "Kategorie jídel"
            name: categories
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "ID kategorie"
                name: id
                widget: string
                hint: "Jedinečný identifikátor bez diakritiky, např. hlavni-jidla"

              - label: "Název kategorie"
                name: title
                widget: string

              - label: "Zobrazovat kategorii"
                name: published
                widget: boolean
                default: true

              - label: "Jídla"
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.name}} — {{fields.price}} Kč"
                fields:
                  - label: "Kód položky"
                    name: code
                    widget: string
                    required: false
                    hint: "Interní číslo z původního jídelního lístku"

                  - label: "Název jídla"
                    name: name
                    widget: string

                  - label: "Popis"
                    name: description
                    widget: text
                    required: false

                  - label: "Gramáž"
                    name: portion
                    widget: string
                    required: false
                    hint: "Např. 150 g, 200 g nebo 1 ks"

                  - label: "Možnost poloviční porce"
                    name: halfPortionAvailable
                    widget: boolean
                    default: false

                  - label: "Cena (Kč)"
                    name: price
                    widget: number
                    value_type: int
                    min: 0

                  - label: "Alergeny"
                    name: allergens
                    widget: list
                    required: false
                    field:
                      label: "Číslo alergenu"
                      name: allergen
                      widget: number
                      value_type: int
                      min: 1
                      max: 14

                  - label: "Zobrazovat jídlo"
                    name: published
                    widget: boolean
                    default: true
          - label: "Informace k jídelnímu lístku"
            name: notes
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "Text"
                name: text
                widget: text
  - name: drinkMenu
    label: "Nápojový lístek"
    files:
      - name: menu
        label: "Nápojový lístek"
        file: "src/content/drinkMenu/menu.json"
        format: json
        fields:
          - label: "Kategorie nápojů"
            name: categories
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "ID kategorie"
                name: id
                widget: string
                hint: "Např. cepovane-pivo, nealkoholicke-napoje"

              - label: "Název kategorie"
                name: title
                widget: string

              - label: "Zobrazovat kategorii"
                name: published
                widget: boolean
                default: true

              - label: "Nápoje"
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - label: "Kód položky"
                    name: code
                    widget: string
                    required: false

                  - label: "Název nápoje"
                    name: name
                    widget: string

                  - label: "Popis"
                    name: description
                    widget: text
                    required: false

                  - label: "Varianty objemu a ceny"
                    name: variants
                    widget: list
                    collapsed: true
                    summary: "{{fields.volume}} — {{fields.price}} Kč"
                    min: 1
                    fields:
                      - label: "Objem"
                        name: volume
                        widget: string
                        required: false
                        hint: "Např. 0,3 l, 0,5 l, 4 cl"

                      - label: "Cena (Kč)"
                        name: price
                        widget: number
                        value_type: int
                        min: 0

                  - label: "Alergeny"
                    name: allergens
                    widget: list
                    required: false
                    field:
                      label: "Číslo alergenu"
                      name: allergen
                      widget: number
                      value_type: int
                      min: 1
                      max: 14

                  - label: "Zobrazovat nápoj"
                    name: published
                    widget: boolean
                    default: true

          - label: "Informace k nápojovému lístku"
            name: notes
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - label: "Nadpis"
                name: title
                widget: string

              - label: "Text"
                name: text
                widget: text